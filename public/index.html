<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNR Document Stamping System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="8" fill="#e74c3c"/>
                    <path d="M12 10h16v3H12V10zm0 5h16v3H12v-3zm0 5h10v3H12v-3zm0 5h16v3H12v-3z" fill="white"/>
                </svg>
                <div class="logo-text">
                    <h1>RNR</h1>
                    <span>Document Stamping System</span>
                </div>
            </div>
            <p class="tagline">MGB XI - Davao City | Records and Releasing Unit</p>
        </div>
    </header>

    <main class="main-container">
        <div class="upload-section">
            <div class="card">
                <h2>Upload Document</h2>
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="upload-text">Drag & drop your PDF here</p>
                    <p class="upload-subtext">or click to browse</p>
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                </div>
                <div class="file-info" id="fileInfo" style="display: none;">
                    <div class="file-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                    <div class="file-details">
                        <span class="filename" id="filename">document.pdf</span>
                        <span class="page-count" id="pageCount"></span>
                    </div>
                    <button class="remove-file" id="removeFile" title="Remove file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <p class="file-hint">Maximum file size: 50MB</p>
            </div>

            <div class="card">
                <h2>Stamp Details</h2>
                <form id="stampForm">
                    <div class="form-group">
                        <label for="docNumber">Document Number <span class="required">*</span></label>
                        <input type="text" id="docNumber" name="docNumber" placeholder="Enter document number" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date <span class="required">*</span></label>
                            <input type="date" id="date" name="date" required>
                        </div>
                        <div class="form-group">
                            <label for="time">Time <span class="required">*</span></label>
                            <input type="time" id="time" name="time" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="receivedBy">Received By</label>
                        <div class="receiver-dropdown">
                            <select id="receivedBy">
                                <option value="">-- Select --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Stamp Position</label>
                        <div class="select-wrapper">
                            <select id="position" name="position">
                                <option value="bottom-right">Bottom Right</option>
                                <option value="bottom-left">Bottom Left</option>
                                <option value="top-right">Top Right</option>
                                <option value="top-left">Top Left</option>
                                <option value="center">Center</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Apply Stamp To</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="pages" value="all" checked>
                                <span class="radio-custom"></span>
                                All Pages
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="pages" value="first">
                                <span class="radio-custom"></span>
                                First Page Only
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="processBtn" disabled>
                        <span class="btn-text">Process PDF</span>
                        <span class="btn-loader" style="display: none;">
                            <svg class="spinner" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4"/>
                            </svg>
                            Processing...
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <div class="card preview-card">
                <div class="preview-header">
                    <h2>Preview</h2>
                    <div class="preview-actions">
                        <button class="btn btn-secondary" id="resetBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="1 4 1 10 7 10"/>
                                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                            </svg>
                            Reset
                        </button>
                        <button class="btn btn-success" id="downloadBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Download Stamped PDF
                        </button>
                    </div>
                </div>
                <div class="preview-container">
                    <iframe id="pdfPreview" frameborder="0"></iframe>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>RNR Document Stamping System &copy; 2026 | MGB XI - Davao City</p>
    </footer>

    <div class="toast" id="toast">
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
